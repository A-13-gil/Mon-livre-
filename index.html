<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5146d8">
<link rel="manifest" href="manifest.webmanifest">
<title>Mon Livre</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#faf8ff;color:#24233a}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #ddd}
header{padding:20px 18px 14px;background:linear-gradient(135deg,#5146d8,#8b74ef);color:white;border-radius:0 0 28px 28px}
.brand{font-size:28px;font-weight:800}.subtitle{opacity:.9;margin-top:4px}
main{padding:18px 16px 90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card,.book{background:#fff;border:1px solid #eee9ff;border-radius:18px;padding:15px;box-shadow:0 5px 18px #3c2f7710}
.primary{background:#5146d8;color:#fff;border-radius:14px;padding:14px 16px;width:100%;font-weight:700}
.secondary{background:#f0edff;color:#4438b8;border-radius:14px;padding:13px;width:100%;font-weight:700}
h2{margin:6px 0 14px}.muted{color:#777;font-size:14px}.cover{height:150px;border-radius:14px;object-fit:cover;width:100%;background:linear-gradient(135deg,#eee9ff,#ffd9e7);display:flex;align-items:center;justify-content:center;font-size:42px}
label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid #ddd8ef;border-radius:12px;padding:12px;background:#fff}textarea{min-height:180px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.book{display:flex;gap:12px;align-items:center;margin-bottom:10px}.thumb{width:68px;height:84px;border-radius:10px;object-fit:cover;background:#eee9ff;display:flex;align-items:center;justify-content:center;font-size:25px}.book h3{margin:0 0 4px}.book small{color:#777}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:#666;font-size:12px}.navicon{display:block;font-size:21px;margin-bottom:2px}.active{color:#5146d8!important;font-weight:700}
.hidden{display:none!important}.pill{display:inline-block;padding:6px 9px;background:#f0edff;color:#5146d8;border-radius:999px;font-size:12px;margin:3px}.back{background:none;color:#5146d8;padding:4px 0;font-weight:700}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#25233a;color:white;padding:11px 16px;border-radius:999px;display:none;z-index:10}
.signature{border:1px dashed #bbb0ee;border-radius:14px;padding:15px;text-align:center;font-family:cursive;font-size:30px;color:#5146d8;min-height:80px}

/* ===== Éditeur intérieur du livre ===== */
.editor-shell{background:#eee7dc;padding:12px;border-radius:18px}
.editor-top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.page-nav{display:flex;gap:6px;align-items:center}
.tool-row{display:flex;gap:5px;flex-wrap:wrap;background:#fff;padding:8px;border-radius:14px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
.tool-row button{min-width:38px;padding:9px 10px;border:1px solid #ddd;border-radius:9px;background:#fafafa;font-weight:700}
.tool-row select{padding:9px;border:1px solid #ddd;border-radius:9px;background:#fafafa}
.book-paper{background:#fff;min-height:470px;border-radius:4px;padding:28px 24px;box-shadow:0 5px 18px #0002;position:relative}
.book-paper:before{content:"";position:absolute;left:14px;top:20px;bottom:20px;width:1px;background:#eee}
.page-title-edit{width:100%;font-size:22px;font-weight:700;border:0;outline:0;margin-bottom:14px;background:transparent}
.rich-editor{min-height:300px;outline:0;line-height:1.75;font-size:17px;padding:4px 5px}
.rich-editor:empty:before{content:"Commencez à écrire votre histoire ici…";color:#aaa}
.paper-footer{text-align:center;color:#999;font-size:12px;margin-top:18px}
.editor-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.editor-actions button{padding:12px;border:0;border-radius:12px;font-weight:700}
.image-preview-row{display:flex;gap:8px;overflow:auto;margin-top:10px}
.page-image-thumb{width:82px;height:62px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.save-state{font-size:12px;color:#6d7a70}
.chapter-badge{display:inline-block;background:#f1eadf;padding:5px 9px;border-radius:20px;font-size:12px;margin-bottom:8px}

</style>

<style id="monlivre-splash-css">
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(145deg,#6b45d8,#9b62e8);display:flex;align-items:center;justify-content:center;color:white;transition:opacity .55s ease,visibility .55s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center;animation:splashIn .7s ease both}
.splash-book{width:118px;height:86px;border-radius:16px 16px 10px 10px;background:#7548d7;border:5px solid #3e238f;box-shadow:0 14px 30px #25145f55;position:relative;margin:auto;transform:rotate(-3deg)}
.splash-book:before{content:"";position:absolute;left:52px;top:8px;width:4px;height:64px;background:#c7afff}
.splash-book:after{content:"";position:absolute;left:23px;bottom:-19px;width:72px;height:16px;background:#fff6df;border-radius:0 0 9px 9px;box-shadow:0 5px 0 #d9cbb7}
.splash-title{font-size:34px;font-weight:800;margin-top:32px;letter-spacing:.2px}
.splash-sub{margin-top:7px;opacity:.92;font-size:14px}
.splash-loader{width:110px;height:4px;background:#ffffff45;border-radius:99px;margin:28px auto 0;overflow:hidden}
.splash-loader span{display:block;width:45%;height:100%;background:white;border-radius:99px;animation:load 1.15s ease-in-out infinite}
@keyframes splashIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}
</style>


<style id="creation-upgrade-css">
.cover-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cover-template{height:82px;border-radius:12px;border:2px solid transparent;padding:7px;color:white;font-weight:800;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-size:12px}
.cover-template.selected{border-color:#5146d8;box-shadow:0 0 0 3px #5146d822}
.t1{background:linear-gradient(135deg,#6b45d8,#e85d9e)}.t2{background:linear-gradient(135deg,#5b9d75,#c5d95f)}
.t3{background:linear-gradient(135deg,#e18c42,#efc36c)}.t4{background:linear-gradient(135deg,#4b79a1,#283e51)}
.t5{background:linear-gradient(135deg,#ef8f9f,#f7c5d0)}.t6{background:linear-gradient(135deg,#333,#777)}
.step{display:flex;gap:8px;align-items:center;margin:5px 0 14px}.step b{width:28px;height:28px;border-radius:50%;background:#5146d8;color:white;display:grid;place-items:center}.step span{font-size:13px;color:#777}
</style>

</head>
<body>

<div id="splash" aria-label="Ouverture de Mon Livre">
  <div class="splash-inner">
    <div class="splash-book"></div>
    <div class="splash-title">Mon Livre</div>
    <div class="splash-sub">Écrire • Créer • Lire</div>
    <div class="splash-loader"><span></span></div>
  </div>
</div>

<div class="app">
<header><div class="brand">📖 Mon Livre</div><div class="subtitle">Écrire • Créer • Lire</div></header>
<main id="main"></main>
<nav>
<button id="navHome" onclick="home()"><span class="navicon">⌂</span>Accueil</button>
<button id="navBooks" onclick="books()"><span class="navicon">📚</span>Mes livres</button>
<button onclick="createBook()"><span class="navicon">➕</span>Créer</button>
<button onclick="profile()"><span class="navicon">👤</span>Profil</button>
</nav>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='monLivreBooksV1';
let state={view:'home',editId:null};
const $=id=>document.getElementById(id);
function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function toast(t){let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function imgData(file,cb){if(!file)return cb('');let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function shell(html){$('main').innerHTML=html}
function home(){
 state.view='home'; state.editId=null;
 let d=data();
 shell(`<h2>Bienvenue 👋</h2>
 <div class="card"><div class="cover">📖</div><h2>Votre espace de création</h2><p class="muted">Créez vos propres livres, ajoutez du texte et des images, puis retrouvez-les quand vous voulez.</p><button class="primary" onclick="createBook()">+ Créer un livre</button></div>
 <div style="height:12px"></div><div class="grid">
 <button class="secondary" onclick="books()">📚 Mes livres (${d.length})</button>
 <button class="secondary" onclick="profile()">⚙️ Profil</button></div>`);
 active('navHome')
}
function books(){
 let d=data();
 shell(`<button class="back" onclick="home()">← Accueil</button><h2>Mes livres</h2>
 ${d.length?d.map(b=>`<div class="book"><div class="thumb">${b.cover?`<img src="${b.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:'📖'}</div><div style="flex:1"><h3>${esc(b.title)}</h3><small>${esc(b.author||'Auteur')} • ${b.language||'Français'}</small><div><span class="pill">${b.pages?.length||1} page(s)</span></div></div><button class="secondary" style="flex:0 0 72px;padding:9px" onclick="openBook('${b.id}')">Ouvrir</button></div>`).join(''):'<div class="card"><p>Vous n’avez encore aucun livre.</p><button class="primary" onclick="createBook()">Créer mon premier livre</button></div>'}`);
 active('navBooks')
}
function createBook(){
 pendingCover=''; window.selectedTemplate='t1';
 shell(`<button class="back" onclick="home()">← Retour</button><h2>Créer un livre</h2>
 <div class="step"><b>1</b><span>Choisissez l’apparence de votre couverture</span></div>
 <div class="card">
 <div class="cover" id="coverPreview">📖</div>
 <label>Modèle de couverture</label>
 <div class="cover-choice">
 ${[['t1','Fleurs'],['t2','Nature'],['t3','Voyage'],['t4','Classique'],['t5','Romantique'],['t6','Minimaliste']].map((x,i)=>`<button type="button" class="cover-template ${i===0?'selected':''} ${x[0]}" onclick="chooseTemplate('${x[0]}','${x[1]}')">${x[1]}</button>`).join('')}
 </div>
 <label>Ou choisissez votre propre image</label>
 <input id="cover" type="file" accept="image/*" onchange="previewCover(this)">
 </div>
 <div class="step"><b>2</b><span>Donnez une identité à votre livre</span></div>
 <div class="card">
 <label>Titre du livre</label><input id="title" placeholder="Ex. Mon histoire">
 <label>Auteur</label><input id="author" placeholder="Votre nom">
 <label>Langue du livre</label>
 <select id="language"><option>Français</option><option>Anglais</option><option>Bambara</option><option>Dioula</option><option>Arabe</option><option>Autre</option></select>
 </div>
 <div class="step"><b>3</b><span>Commencez votre première page</span></div>
 <div class="card">
 <textarea id="firstPage" placeholder="Écrivez les premières lignes de votre livre..."></textarea>
 <div style="height:10px"></div><button class="primary" onclick="finishCreate()">📖 Créer mon livre</button>
 </div>`);
}
function chooseTemplate(cls,label){
 window.selectedTemplate=cls;
 document.querySelectorAll('.cover-template').forEach(x=>x.classList.remove('selected'));
 document.querySelector('.'+cls)?.classList.add('selected');
 pendingCover='';
 const el=$('coverPreview');
 el.className='cover '+cls;
 el.textContent=label;
}
let pendingCover='';
function previewCover(el){imgData(el.files[0],x=>{pendingCover=x;$('coverPreview').innerHTML=x?`<img src="${x}" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`:'📖'})}
function finishCreate(){
 let title=$('title').value.trim()||'Sans titre', author=$('author').value.trim()||'Auteur';
 let b={id:Date.now().toString(),title,author,language:$('language').value,cover:pendingCover,coverTemplate:window.selectedTemplate||'t1',pages:[{text:$('firstPage').value,images:[],signature:''}],created:new Date().toISOString()};
 let d=data();d.unshift(b);save(d);pendingCover='';toast('Livre créé ❤️');openBook(b.id)
}
function openBook(id){state.editId=id;let b=data().find(x=>x.id===id);if(!b)return books();
 shell(`<button class="back" onclick="books()">← Mes livres</button><div class="card"><div class="cover">${b.cover?`<img src="${b.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`:'📖'}</div><h2>${esc(b.title)}</h2><p class="muted">${esc(b.author)} • ${b.language}</p>
 <div class="grid"><button class="primary" onclick="editPage('${id}')">✏️ Écrire</button><button class="secondary" onclick="readBook('${id}')">📖 Lire</button></div></div>
 <div style="height:12px"></div><div class="card"><h3>Pages</h3>${b.pages.map((p,i)=>`<div class="pill">Page ${i+1}</div>`).join('')}<button class="secondary" style="margin-top:10px" onclick="addPage('${id}')">+ Ajouter une page</button></div>`)
}
function editPage(id,pi=0){
 let d=data(),b=d.find(x=>x.id===id),p=b.pages[pi]||{text:'',images:[],signature:''};
 shell(`<button class="back" onclick="openBook('${id}')">← Livre</button><h2>Édition — page ${pi+1}</h2>
 <div class="card"><textarea id="pageText" placeholder="Écrivez votre texte...">${esc(p.text)}</textarea>
 <label>Ajouter une image</label><input id="pageImg" type="file" accept="image/*" onchange="previewPageImg(this)">
 <div id="pageImgPreview">${(p.images||[]).map(x=>`<img src="${x}" style="width:100%;border-radius:12px;margin-top:8px">`).join('')}</div>
 <label>Signature</label><input id="sig" placeholder="Écrivez votre signature (ex. Amina ♥)" value="${esc(p.signature||'')}">
 <div class="signature" id="sigPreview">${esc(p.signature||'Votre signature')}</div>
 <div class="row"><button class="secondary" onclick="savePage('${id}',${pi})">💾 Enregistrer</button><button class="primary" onclick="savePage('${id}',${pi});addPage('${id}')">+ Page suivante</button></div></div>`);
 $('sig').addEventListener('input',e=>$('sigPreview').textContent=e.target.value||'Votre signature')
}
let pendingPageImg='';
function previewPageImg(el){imgData(el.files[0],x=>{pendingPageImg=x;$('pageImgPreview').innerHTML=x?`<img src="${x}" style="width:100%;border-radius:12px;margin-top:8px">`:''})}
function savePage(id,pi){
 let d=data(),b=d.find(x=>x.id===id);b.pages[pi].text=$('pageText').value;b.pages[pi].signature=$('sig').value;
 if(pendingPageImg){b.pages[pi].images=b.pages[pi].images||[];b.pages[pi].images.push(pendingPageImg);pendingPageImg=''}
 save(d);toast('Page enregistrée ✓')
}
function addPage(id){let d=data(),b=d.find(x=>x.id===id);b.pages.push({text:'',images:[],signature:''});save(d);editPage(id,b.pages.length-1)}
function readBook(id){
 let b=data().find(x=>x.id===id),i=0;
 function render(){let p=b.pages[i];shell(`<button class="back" onclick="openBook('${id}')">← Quitter la lecture</button><h2>${esc(b.title)}</h2><div class="card"><span class="pill">Page ${i+1}/${b.pages.length}</span><div style="white-space:pre-wrap;line-height:1.7;margin-top:14px">${esc(p.text)||'<span class="muted">Page vide</span>'}</div>${(p.images||[]).map(x=>`<img src="${x}" style="width:100%;border-radius:14px;margin-top:14px">`).join('')}${p.signature?`<div class="signature" style="margin-top:15px">${esc(p.signature)}</div>`:''}</div><div class="row"><button class="secondary" ${i===0?'disabled':''} onclick="i--;render()">← Précédente</button><button class="primary" ${i===b.pages.length-1?'disabled':''} onclick="i++;render()">Suivante →</button></div>`)}
 render()
}
function profile(){shell(`<button class="back" onclick="home()">← Accueil</button><h2>Mon profil</h2><div class="card"><div class="cover">👤</div><h3>Mon espace personnel</h3><p class="muted">Les livres sont enregistrés directement sur ce téléphone dans cette première version.</p><label>Langue de l’application</label><select onchange="toast('Langue sélectionnée : '+this.value)"><option>Français</option><option>English</option><option>Bambara</option><option>Dioula</option></select><label>Apparence</label><select onchange="document.body.style.background=this.value==='Sombre'?'#171622':'#faf8ff'"><option>Clair</option><option>Sombre</option></select></div>`)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function active(id){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));$(id)?.classList.add('active')}
home();
function editPage(bookId,pageIndex){
  const b=books.find(x=>x.id===bookId); if(!b) return;
  if(!b.pages) b.pages=[{title:"Première page",text:"",images:[],signature:""}];
  const p=b.pages[pageIndex] || (b.pages[pageIndex]={title:"Nouvelle page",text:"",images:[],signature:""});
  if(!p.images) p.images=[];
  if(!p.title) p.title="Nouvelle page";

  const initialContent = p.text && p.text.includes("<") ? p.text : esc(p.text||"").replace(/\n/g,"<br>");
  app.innerHTML=`
    <div class="top"><button class="back" onclick="openBook('${bookId}')">←</button><h2>Écrire</h2><span class="save-state" id="saveState">✓ Enregistré</span></div>
    <div class="editor-shell">
      <div class="editor-top">
        <div class="page-nav">
          <button class="secondary" onclick="changePage('${bookId}',${pageIndex-1})" ${pageIndex<=0?"disabled":""}>‹</button>
          <span>Page ${pageIndex+1} / ${b.pages.length}</span>
          <button class="secondary" onclick="changePage('${bookId}',${pageIndex+1})" ${pageIndex>=b.pages.length-1?"disabled":""}>›</button>
        </div>
        <span class="chapter-badge">📖 ${esc(b.title||"Mon livre")}</span>
      </div>

      <div class="tool-row">
        <button onclick="formatDoc('bold')" title="Gras"><b>G</b></button>
        <button onclick="formatDoc('italic')" title="Italique"><i>I</i></button>
        <button onclick="formatDoc('underline')" title="Souligné"><u>S</u></button>
        <button onclick="formatDoc('justifyLeft')">☰</button>
        <button onclick="formatDoc('justifyCenter')">≡</button>
        <button onclick="formatDoc('justifyRight')">☷</button>
        <select onchange="changeFontSize(this.value)">
          <option value="">Taille</option><option value="2">Petit</option><option value="3">Normal</option><option value="4">Grand</option><option value="5">Très grand</option>
        </select>
      </div>

      <div class="book-paper">
        <input id="pageTitle" class="page-title-edit" value="${esc(p.title)}" placeholder="Titre de la page ou du chapitre">
        <div id="richEditor" class="rich-editor" contenteditable="true">${initialContent}</div>
        <div class="image-preview-row" id="imageRow"></div>
        <div class="paper-footer">— ${pageIndex+1} —</div>
      </div>

      <div class="editor-actions">
        <button class="secondary" onclick="pickPageImage('${bookId}',${pageIndex})">🖼️ Ajouter une image</button>
        <button class="secondary" onclick="addTypedSignature('${bookId}',${pageIndex})">✍️ Ajouter une signature</button>
        <button class="secondary" onclick="addPage('${bookId}')">＋ Nouvelle page</button>
        <button class="primary" onclick="savePage('${bookId}',${pageIndex})">💾 Enregistrer</button>
      </div>
      <input id="pageImageInput" type="file" accept="image/*" style="display:none">
    </div>
  `;

  renderPageImages(p);
  const ed=document.getElementById("richEditor");
  ed.addEventListener("input",()=>{ document.getElementById("saveState").textContent="● Modifications…"; clearTimeout(window._autoSave); window._autoSave=setTimeout(()=>savePage(bookId,pageIndex,true),700); });
  document.getElementById("pageTitle").addEventListener("input",()=>{document.getElementById("saveState").textContent="● Modifications…"; clearTimeout(window._autoSave); window._autoSave=setTimeout(()=>savePage(bookId,pageIndex,true),700);});
}

function formatDoc(cmd){
  document.execCommand(cmd,false,null);
  document.getElementById("richEditor")?.focus();
}
function changeFontSize(v){
  if(v) document.execCommand("fontSize",false,v);
  document.getElementById("richEditor")?.focus();
}
function savePage(bookId,pageIndex,silent=false){
  const b=books.find(x=>x.id===bookId); if(!b||!b.pages?.[pageIndex]) return;
  const p=b.pages[pageIndex];
  p.title=document.getElementById("pageTitle")?.value || "Nouvelle page";
  p.text=document.getElementById("richEditor")?.innerHTML || "";
  localStorage.setItem("monLivreBooks",JSON.stringify(books));
  const s=document.getElementById("saveState"); if(s) s.textContent="✓ Enregistré";
  if(!silent) toast("Page enregistrée ✓");
}
function changePage(bookId,index){
  if(index<0) return;
  const b=books.find(x=>x.id===bookId); if(!b||index>=b.pages.length) return;
  savePage(bookId,Math.min(index+1,b.pages.length-1),true);
  editPage(bookId,index);
}
function pickPageImage(bookId,pageIndex){
  const input=document.getElementById("pageImageInput"); if(!input) return;
  input.onchange=()=>{
    const file=input.files?.[0]; if(!file) return;
    const r=new FileReader();
    r.onload=e=>{
      const b=books.find(x=>x.id===bookId); const p=b.pages[pageIndex];
      p.images=p.images||[]; p.images.push(e.target.result);
      localStorage.setItem("monLivreBooks",JSON.stringify(books));
      renderPageImages(p); toast("Image ajoutée ✓");
    };
    r.readAsDataURL(file);
  };
  input.click();
}
function renderPageImages(p){
  const row=document.getElementById("imageRow"); if(!row) return;
  row.innerHTML=(p.images||[]).map((src,i)=>`<img class="page-image-thumb" src="${src}" alt="Image ${i+1}">`).join("");
}
function addTypedSignature(bookId,pageIndex){
  const sig=prompt("Écrivez votre signature :");
  if(!sig) return;
  const b=books.find(x=>x.id===bookId); const p=b.pages[pageIndex];
  p.signature=sig;
  const ed=document.getElementById("richEditor");
  ed.innerHTML += `<p style="text-align:right;margin-top:35px;font-family:cursive;font-size:24px">✍️ ${esc(sig)}</p>`;
  savePage(bookId,pageIndex,true); toast("Signature ajoutée ✓");
}
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>

<script>
window.addEventListener("load",()=>{
  setTimeout(()=>document.getElementById("splash")?.classList.add("hide"),1250);
});
</script>
